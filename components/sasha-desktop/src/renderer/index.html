<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Nothing remote loads. 'self' only, no inline script, no inline style, no
      framing, no form posts, no base-uri games. audit:surface requires this tag
      and requires default-src to stay 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Sasha</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="wordmark">
        <h1>Sasha</h1>
        <!-- D53: Sasha never ships bare. The function tagline rides every surface. -->
        <p class="tagline">a personal AI that is yours — your files, your models, your machine</p>
      </div>
      <div class="masthead-actions">
        <label class="model-picker">
          <span class="model-label">Model</span>
          <select id="model-select"></select>
        </label>
        <button id="bell-toggle" type="button" class="ghost">Waiting</button>
      </div>
    </header>

    <section id="status-strip" class="status-strip" hidden>
      <p id="status-text"></p>
      <p id="status-detail" class="muted"></p>
    </section>

    <!-- The doorbell, demoted to a drawer: it matters, but it is not the product. -->
    <section id="bell-drawer" class="bell-drawer" hidden>
      <div class="drawer-head">
        <h2>Waiting for you</h2>
        <button id="refresh" type="button" class="ghost small-btn">Check now</button>
      </div>
      <div id="bell" class="bell"></div>
    </section>

    <main id="transcript" class="transcript"></main>

    <footer class="composer">
      <div class="composer-row">
        <textarea
          id="input"
          rows="1"
          placeholder="Ask Sasha anything, or type / for a command…"
          autofocus
        ></textarea>
        <button id="send" type="button" class="primary">Send</button>
        <button id="stop" type="button" class="ghost" hidden>Stop</button>
      </div>
      <p id="composer-hint" class="muted small"></p>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
